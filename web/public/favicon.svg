<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6cf0"/>
      <stop offset="1" stop-color="#5f45d0"/>
    </linearGradient>
  </defs>

  <!-- 底：品牌紫渐变 -->
  <rect width="512" height="512" rx="112" fill="url(#g)"/>

  <!-- 显示器底座：柱 + 脚 -->
  <rect x="230" y="346" width="52" height="44" rx="13" fill="#e8e3fb"/>
  <rect x="156" y="384" width="200" height="28" rx="14" fill="#ffffff"/>

  <!-- 显示器外框：白色胖圆角（加大版） -->
  <rect x="66" y="100" width="380" height="250" rx="44" fill="#ffffff"/>
  <!-- 屏幕：浅紫白 -->
  <rect x="88" y="122" width="336" height="206" rx="28" fill="#f1edff"/>

  <!-- 屏内 2×3 彩色功能小方块 -->
  <!-- 1 主页（品牌紫，房子） -->
  <rect x="116" y="138" width="80" height="70" rx="20" fill="#8a6cf0"/>
  <g transform="translate(156,173) scale(1.12)">
    <path d="M -10 13 L -10 -3 L 0 -13 L 10 -3 L 10 13 Z" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- 2 提醒（橙，铃铛） -->
  <rect x="216" y="138" width="80" height="70" rx="20" fill="#ff9f43"/>
  <g transform="translate(256,173) scale(1.12)">
    <path d="M -12 13 Q -16 -9 0 -13 Q 16 -9 12 13 Z" fill="#ffffff"/>
    <line x1="-16" y1="18" x2="16" y2="18" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- 3 待办（绿，对勾） -->
  <rect x="316" y="138" width="80" height="70" rx="20" fill="#2fbf71"/>
  <g transform="translate(356,173) scale(1.12)">
    <path d="M -17 1 L -4 14 L 17 -13" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 4 SSH（蓝，终端 >_） -->
  <rect x="116" y="238" width="80" height="70" rx="20" fill="#4da3ff"/>
  <g transform="translate(156,273) scale(1.12)">
    <path d="M -19 -13 L -5 0 L -19 13" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="3" y1="14" x2="19" y2="14" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- 5 服务器监控（粉，心跳线） -->
  <rect x="216" y="238" width="80" height="70" rx="20" fill="#ff6b9d"/>
  <g transform="translate(256,273) scale(1.12)">
    <path d="M -23 1 L -9 1 L -3 -15 L 5 15 L 11 1 L 23 1" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 6 设置（灰紫，调节杆） -->
  <rect x="316" y="238" width="80" height="70" rx="20" fill="#8b86c9"/>
  <g transform="translate(356,273) scale(1.12)">
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="-20" y1="10" x2="20" y2="10" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="6" cy="-10" r="8" fill="#ffffff"/>
    <circle cx="-10" cy="10" r="8" fill="#ffffff"/>
  </g>
</svg>
